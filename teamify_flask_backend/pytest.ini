[pytest]
# Default collection: only the mocked unit tests (no live server needed).
# To run live network tests:  pytest test_network.py -v -s
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short

markers =
    integration: mark test as an integration test

filterwarnings =
    # SQLAlchemy 2.0 migration: Query.get() is legacy but still works; silence for now.
    ignore::sqlalchemy.exc.LegacyAPIWarning
    # datetime.utcnow() deprecation in Python 3.12+
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning